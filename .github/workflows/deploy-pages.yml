name: Deploy TOMIC BAU preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify website assets
        shell: bash
        run: |
          set -euo pipefail
          for file in einfahrt kabeltrasse bagger asphaltstreifen hof wege kabelgraben gehweg mast bordsteine bord kabelmaterial original-logo graben; do
            test -s "assets/${file}.webp" || { echo "::error::Missing assets/${file}.webp"; exit 1; }
          done
          test -s index.html
      - name: Install approved header artwork
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/approved-header.png.base64 > assets/approved-header.png
          test -s assets/approved-header.png
          file assets/approved-header.png
      - name: Validate static pages, links and images
        run: python3 scripts/check_site.py
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          Path('/tmp/tomic-inline.js').write_text('\\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/tomic-inline.js
      - name: Check mobile and desktop layout in Chromium
        continue-on-error: true # Browser audit is informational until CI environment is stabilized
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tomic-playwright --no-audit --no-fund playwright
          /tmp/tomic-playwright/node_modules/.bin/playwright install chromium --with-deps
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tomic-http.log 2>&1 &
          NODE_PATH=/tmp/tomic-playwright/node_modules node scripts/check_browser.cjs
      - name: Stage approved public files
        run: python3 scripts/stage_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
